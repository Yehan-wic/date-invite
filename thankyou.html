<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>It's a date ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#ffdce3,#f3a5b8)}
.card{width:min(650px,100%);text-align:center;background:rgba(255,255,255,.97);border-radius:34px;padding:55px 35px;box-shadow:0 25px 65px rgba(100,40,60,.18)}
.emoji{font-size:70px;animation:bounce 1.7s ease-in-out infinite}@keyframes bounce{50%{transform:translateY(-8px) scale(1.04)}}
h1{font-family:"Segoe Print","Comic Sans MS",cursive;font-size:clamp(36px,7vw,54px);margin:16px 0;color:#333}
p{color:#777;font-size:18px;line-height:1.7}.small{margin-top:20px;color:#c25a72;font-family:"Segoe Print","Comic Sans MS",cursive}
</style>
</head>
<body>
<main class="card">
  <div class="emoji">💗</div>
  <h1>It's a date!</h1>
  <p>Now I know your choice ❤️</p>
  <p>I can't wait for our little café adventure, Nethu. 🥰</p>
  <div class="small">See you soon 🌷</div>
</main>
</body>
</html>
